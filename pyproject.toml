[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "text-to-3d-mesh-studio"
version = "0.6.3"
description = "Text-to-3D mesh generation studio: prompt -> latent triplane -> mesh, with export and viewer."
readme = "CONTRIBUTING.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "mesh-studio contributors" }]
keywords = ["text-to-3d", "text-to-mesh", "triplane", "nerf", "gaussian-splatting", "generative-3d"]
dependencies = [
    "torch>=2.3.0",
    "torchvision>=0.18.0",
    "transformers>=4.42.0",
    "diffusers>=0.29.0",
    "numpy>=1.26.0",
    "trimesh>=4.3.0",
    "pillow>=10.3.0",
    "pyyaml>=6.0.1",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "gradio>=4.36.0",
    "einops>=0.7.0",
    "scipy>=1.12.0",
]

[project.optional-dependencies]
cuda = ["xformers>=0.0.27", "triton>=3.0.0"]
dev = ["pytest>=8.2.0", "ruff>=0.5.0", "mypy>=1.10.0"]

[project.scripts]
mesh-studio = "mesh_studio.cli:app"

[tool.setuptools.packages.find]
include = ["mesh_studio*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"